[package]
name = "boss-scheduler"
version = "0.1.0"
edition = "2024"
description = "Tiny always-on job scheduler for the BOSS workspace"
license = "Apache-2.0"
repository = "https://github.com/risa-labs-inc/BossScheduler"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bin]]
name = "boss-sched"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
strip = true
